<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Operação PMESP</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="app">

        <!-- Cabeçalho -->

        <header class="header">

            <h1>Operação PMESP</h1>

            <p id="saudacao">Bom dia.</p>

        </header>

        <!-- Barra de progresso -->

        <section class="progress-card">

            <div class="progress-info">

                <span>Meta do Dia</span>

                <span id="porcentagem">0%</span>

            </div>

            <div class="progress">

                <div class="progress-fill" id="barra"></div>

            </div>

        </section>

        <!-- Menu -->

        <section class="menu">

            <button class="card">
                📅
                <span>Rotina</span>
            </button>

            <button class="card">
                📚
                <span>Estudos</span>
            </button>

            <button class="card">
                🏃
                <span>Treinos</span>
            </button>

            <button class="card">
                ✍️
                <span>Redação</span>
            </button>

            <button class="card">
                📝
                <span>Simulado</span>
            </button>

            <button class="card">
                📊
                <span>Relatórios</span>
            </button>

        </section>

        <!-- Missão do Dia -->

        <section class="today">

            <h2>Missão de Hoje</h2>

            <div class="task">

                <input type="checkbox">

                <label>Acordar às 06:00</label>

            </div>

            <div class="task">

                <input type="checkbox">

                <label>Corrida da manhã</label>

            </div>

            <div class="task">

                <input type="checkbox">

                <label>Português</label>

            </div>

            <div class="task">

                <input type="checkbox">

                <label>Matemática</label>

            </div>

            <div class="task">

                <input type="checkbox">

                <label>Atualidades</label>

            </div>

        </section>

        <!-- Navegação inferior -->

        <nav class="bottom-nav">

            <button>🏠</button>

            <button>📚</button>

            <button class="center">+</button>

            <button>📊</button>

            <button>⚙️</button>

        </nav>

    </div>

<script src="js/script.js"></script>

</body>

</html>
